<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Kreator strony | BuildCMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/admin/builder.css?v=2.1b-fix2">
  <!-- Inline fallback styles if Tailwind fails -->
  <style>
    body { margin:0; font-family:'Inter',sans-serif; background:#0f172a; color:#94a3b8; font-size:13px; }
    .builder-root { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    .builder-toolbar { height:56px; background:#1e293b; border-bottom:1px solid #334155; display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0; }
    .builder-workspace { flex:1; display:flex; overflow:hidden; }
    .builder-sidebar { width:260px; background:#1e293b; border-right:1px solid #334155; display:flex; flex-direction:column; flex-shrink:0; }
    .builder-canvas { flex:1; background:#0b1120; overflow-y:auto; padding:24px; display:flex; justify-content:center; }
    .builder-props { width:280px; background:#1e293b; border-left:1px solid #334155; display:flex; flex-direction:column; flex-shrink:0; }
    #previewCanvas { width:100%; max-width:1200px; background:white; border-radius:12px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); min-height:400px; }
    #previewCanvas.preview-mobile { max-width:375px; border-radius:16px; box-shadow:0 0 0 8px #1e293b, 0 25px 50px -12px rgba(0,0,0,0.8); }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:6px; font-size:12px; font-weight:500; border:1px solid transparent; cursor:pointer; background:transparent; color:#94a3b8; }
    .btn:hover { background:#334155; color:#e2e8f0; }
    .btn-primary { background:#f59e0b; color:#0f172a; }
    .btn-primary:hover { background:#d97706; }
    .outline-item { padding:8px 12px; border-radius:6px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:13px; color:#94a3b8; }
    .outline-item:hover { background:#334155; color:#e2e8f0; }
    .outline-item.active { background:rgba(245,158,11,0.15); color:#fbbf24; border:1px solid rgba(245,158,11,0.3); }
    .hidden { display:none !important; }
  </style>
</head>
<body class="builder-root">

  <!-- Toolbar -->
  <header class="builder-toolbar">
    <div class="flex items-center gap-3">
      <a href="/admin" class="flex items-center gap-2 text-white font-bold text-sm no-underline">
        <div class="w-7 h-7 bg-amber-500 rounded-md flex items-center justify-center text-slate-900 text-xs font-extrabold">B</div>
        BuildCMS
      </a>
      <span style="color:#475569;">|</span>
      <span style="color:#64748b; font-size:12px;">Kreator strony</span>
    </div>

    <div class="flex items-center gap-2">
      <button id="btnDevice" class="btn" title="Przełącz widok">
        <i class="fas fa-mobile-alt"></i> Mobile
      </button>
      <div style="width:1px; height:20px; background:#334155;"></div>
      <button id="btnUndo" class="btn" style="padding:6px 10px;" title="Cofnij"><i class="fas fa-undo text-xs"></i></button>
      <button id="btnRedo" class="btn" style="padding:6px 10px;" title="Ponów"><i class="fas fa-redo text-xs"></i></button>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="window.open('/','_blank')" class="btn" title="Podgląd na żywo">
        <i class="fas fa-external-link-alt"></i> Podgląd
      </button>
      <button id="btnPublish" class="btn btn-primary">
        <i class="fas fa-cloud-upload-alt"></i> Opublikuj
      </button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="builder-workspace">

    <!-- Left: Outline -->
    <aside class="builder-sidebar">
      <div style="height:40px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #334155;">
        <span style="font-size:11px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em;">Struktura</span>
        <button id="btnAddSection" style="width:24px; height:24px; border-radius:6px; background:#334155; color:#f59e0b; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;">
          <i class="fas fa-plus text-xs"></i>
        </button>
      </div>
      <div style="flex:1; overflow-y:auto; padding:8px;" id="outlineTree"></div>
      <div style="padding:12px; border-top:1px solid #334155;">
        <button onclick="toggleSectionVisibility()" style="width:100%; padding:8px; border-radius:6px; background:#334155; color:#cbd5e1; border:none; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; gap:6px;">
          <i class="fas fa-eye"></i> Widoczność
        </button>
        <button onclick="deleteActiveSection()" style="width:100%; padding:8px; border-radius:6px; background:#334155; color:#f87171; border:none; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; gap:6px; margin-top:8px;">
          <i class="fas fa-trash"></i> Usuń sekcję
        </button>
      </div>
    </aside>

    <!-- Center: Canvas -->
    <main class="builder-canvas">
      <div id="previewCanvas">
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:300px; color:#94a3b8;">
          <i class="fas fa-spinner fa-spin" style="font-size:24px; margin-bottom:12px;"></i>
          <p style="font-size:14px;">Ładowanie sekcji...</p>
          <p style="font-size:11px; color:#64748b; margin-top:4px;">Sprawdź konsolę (F12) jeśli trwa dłużej niż 3s</p>
        </div>
      </div>
    </main>

    <!-- Right: Properties -->
    <aside class="builder-props">
      <div style="height:40px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #334155;">
        <span style="font-size:11px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em;">Właściwości</span>
        <button id="btnSave" style="padding:4px 10px; border-radius:6px; background:#f59e0b; color:#0f172a; border:none; cursor:pointer; font-size:11px; font-weight:bold;">
          <i class="fas fa-save" style="margin-right:4px;"></i>Zapisz
        </button>
      </div>
      <div style="flex:1; overflow-y:auto; padding:16px;" id="propertyPanel">
        <div style="text-align:center; color:#64748b; padding:48px 0;">
          <i class="fas fa-mouse-pointer" style="font-size:24px; margin-bottom:8px;"></i>
          <p style="font-size:12px; line-height:1.6;">Kliknij sekcję aby edytować<br><small style="color:#475569;">lub kliknij dwukrotnie tekst aby edytować inline</small></p>
        </div>
      </div>
    </aside>

  </div>

  <!-- Modal: Dodaj sekcję -->
  <div id="addSectionModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); align-items:center; justify-content:center; z-index:100; padding:20px;">
    <div style="background:#1e293b; border:1px solid #334155; border-radius:12px; width:100%; max-width:480px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #334155;">
        <h3 style="color:#e2e8f0; font-size:15px; font-weight:600; margin:0;">Dodaj sekcję</h3>
        <button onclick="document.getElementById('addSectionModal').style.display='none'" style="width:28px; height:28px; border-radius:6px; background:#334155; color:#94a3b8; border:none; cursor:pointer;"><i class="fas fa-times text-xs"></i></button>
      </div>
      <div style="padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        <button onclick="addSectionType('hero')" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px; border-radius:10px; border:1px solid #334155; background:#0f172a; cursor:pointer; color:#e2e8f0;">
          <i class="fas fa-image" style="color:#fb923c; font-size:20px;"></i>
          <span style="font-size:12px;">Hero / Baner</span>
        </button>
        <button onclick="addSectionType('about')" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px; border-radius:10px; border:1px solid #334155; background:#0f172a; cursor:pointer; color:#e2e8f0;">
          <i class="fas fa-building" style="color:#60a5fa; font-size:20px;"></i>
          <span style="font-size:12px;">O nas</span>
        </button>
        <button onclick="addSectionType('services')" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px; border-radius:10px; border:1px solid #334155; background:#0f172a; cursor:pointer; color:#e2e8f0;">
          <i class="fas fa-tools" style="color:#4ade80; font-size:20px;"></i>
          <span style="font-size:12px;">Usługi</span>
        </button>
        <button onclick="addSectionType('gallery')" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px; border-radius:10px; border:1px solid #334155; background:#0f172a; cursor:pointer; color:#e2e8f0;">
          <i class="fas fa-images" style="color:#c084fc; font-size:20px;"></i>
          <span style="font-size:12px;">Galeria</span>
        </button>
        <button onclick="addSectionType('contact')" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px; border-radius:10px; border:1px solid #334155; background:#0f172a; cursor:pointer; color:#e2e8f0;">
          <i class="fas fa-envelope" style="color:#f87171; font-size:20px;"></i>
          <span style="font-size:12px;">Kontakt</span>
        </button>
        <button onclick="addSectionType('cta')" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px; border-radius:10px; border:1px solid #334155; background:#0f172a; cursor:pointer; color:#e2e8f0;">
          <i class="fas fa-bullhorn" style="color:#fbbf24; font-size:20px;"></i>
          <span style="font-size:12px;">Call to Action</span>
        </button>
        <button onclick="addSectionType('text')" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px; border-radius:10px; border:1px solid #334155; background:#0f172a; cursor:pointer; color:#e2e8f0;">
          <i class="fas fa-align-left" style="color:#94a3b8; font-size:20px;"></i>
          <span style="font-size:12px;">Tekst</span>
        </button>
        <button onclick="addSectionType('features')" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px; border-radius:10px; border:1px solid #334155; background:#0f172a; cursor:pointer; color:#e2e8f0;">
          <i class="fas fa-star" style="color:#2dd4bf; font-size:20px;"></i>
          <span style="font-size:12px;">Cechy</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toastContainer" style="position:fixed; bottom:16px; right:16px; z-index:200;"></div>

  <!-- Scripts with cache busting -->
  <script src="/static/js/admin/api-client.js?v=2.1b-fix2"></script>
  <script src="/static/js/admin/ui-utils.js?v=2.1b-fix2"></script>
  <script src="/static/js/admin/builder/outline-tree.js?v=2.1b-fix2"></script>
  <script src="/static/js/admin/builder/property-panel.js?v=2.1b-fix2"></script>
  <script src="/static/js/admin/builder/inline-preview.js?v=2.1b-fix2"></script>
  <script src="/static/js/admin/builder/builder-core.js?v=2.1b-fix2"></script>
</body>
</html>

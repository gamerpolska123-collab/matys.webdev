version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matys-cms-app
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      # PERSISTENT - dane użytkownika (NIE nadpisuj przy aktualizacji!)
      - ./data:/app/data
      - ./uploads:/app/uploads
      # Kod aplikacji montujemy w trybie read-only (opcjonalnie)
      # - ./app:/app/app:ro
      # - ./modules:/app/modules:ro
    environment:
      - DATABASE_URL=sqlite:///data/cms.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@firma.pl}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MODULES_ENABLED=${MODULES_ENABLED:-onepage}
      - UPLOAD_DIR=/app/uploads
    networks:
      - cms-net

  nginx:
    image: nginx:alpine
    container_name: matys-cms-nginx
    restart: unless-stopped
    ports:
      - "${CMS_PORT:-85}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - app
    networks:
      - cms-net

networks:
  cms-net:
    driver: bridge

<header class="admin-navbar bg-white border-b px-4 md:px-8 py-3 flex items-center justify-between sticky top-0 z-40">
  <div class="flex items-center gap-4">
    <button id="sidebarToggle" class="md:hidden text-gray-600 hover:text-gray-900">
      <i class="fas fa-bars text-xl"></i>
    </button>
    <span class="text-sm text-gray-500 hidden sm:inline">v1.1-dev</span>
  </div>
  <div class="flex items-center gap-4">
    <a href="/" target="_blank" class="text-gray-500 hover:text-gray-700 text-sm flex items-center gap-2">
      <i class="fas fa-external-link-alt"></i> <span class="hidden sm:inline">Podgląd strony</span>
    </a>
    <div class="flex items-center gap-2 text-sm text-gray-700">
      <div class="w-8 h-8 bg-amber-100 text-amber-700 rounded-full flex items-center justify-center font-bold">
        {{ user.full_name[0] if user and user.full_name else 'A' }}
      </div>
      <span class="hidden md:inline">{{ user.full_name if user else 'Admin' }}</span>
    </div>
  </div>
</header>
<script>
document.getElementById('sidebarToggle')?.addEventListener('click', () => {
  document.getElementById('adminSidebar').classList.toggle('open');
});
document.getElementById('sidebarClose')?.addEventListener('click', () => {
  document.getElementById('adminSidebar').classList.remove('open');
});
</script>

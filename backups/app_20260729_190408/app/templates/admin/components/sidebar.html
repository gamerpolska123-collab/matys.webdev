<aside id="adminSidebar" class="admin-sidebar bg-gray-900 text-white w-64 flex-shrink-0 flex flex-col">
  <div class="p-6 border-b border-gray-800 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-amber-500 rounded-lg flex items-center justify-center font-bold text-gray-900">B</div>
      <span class="font-bold text-lg">BuildCMS</span>
    </div>
    <button id="sidebarClose" class="md:hidden text-gray-400 hover:text-white">
      <i class="fas fa-times"></i>
    </button>
  </div>
  <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
    <a href="/admin" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-gray-800 transition-colors {% if request.url.path == '/admin' %}bg-gray-800 text-amber-400{% else %}text-gray-300{% endif %}">
      <i class="fas fa-home w-5 text-center"></i> Dashboard
    </a>
    <a href="/admin/builder" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-gray-800 transition-colors {% if request.url.path.startswith('/admin/builder') %}bg-gray-800 text-amber-400{% else %}text-gray-300{% endif %}">
      <i class="fas fa-layer-group w-5 text-center"></i> Kreator strony
    </a>
    <a href="/admin/pages" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-gray-800 transition-colors {% if request.url.path.startswith('/admin/pages') %}bg-gray-800 text-amber-400{% else %}text-gray-300{% endif %}">
      <i class="fas fa-file-alt w-5 text-center"></i> Strony
    </a>
    <a href="/admin/media" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-gray-800 transition-colors {% if request.url.path == '/admin/media' %}bg-gray-800 text-amber-400{% else %}text-gray-300{% endif %}">
      <i class="fas fa-images w-5 text-center"></i> Media
    </a>
    <a href="/admin/settings" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-gray-800 transition-colors {% if request.url.path == '/admin/settings' %}bg-gray-800 text-amber-400{% else %}text-gray-300{% endif %}">
      <i class="fas fa-cog w-5 text-center"></i> Ustawienia
    </a>
    <div class="pt-4 mt-4 border-t border-gray-800">
      <p class="px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Moduły</p>
      {% for item in menu %}
      <a href="{{ item.url }}" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 text-gray-300 transition-colors">
        <i class="fas {{ item.icon }} w-5 text-center"></i> {{ item.label }}
      </a>
      {% endfor %}
    </div>
  </nav>
  <div class="p-4 border-t border-gray-800">
    <a href="/logout" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-red-900/30 text-red-400 transition-colors">
      <i class="fas fa-sign-out-alt w-5 text-center"></i> Wyloguj
    </a>
  </div>
</aside>

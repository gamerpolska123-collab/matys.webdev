{% extends "base.html" %}
{% block title %}{{ 'Edycja' if page else 'Nowa strona' }}{% endblock %}
{% block header %}{{ 'Edycja strony' if page else 'Nowa strona' }}{% endblock %}

{% block content %}
<div class="max-w-3xl">
    <form id="pageForm" class="bg-white rounded-xl shadow-sm border p-6 space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tytuł strony</label>
            <input type="text" id="title" name="title" value="{{ page.title if page else '' }}" required
                class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none"
                placeholder="np. Strona główna">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Slug (URL)</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">/</span>
                    <input type="text" id="slug" name="slug" value="{{ page.slug if page else '' }}" required
                        class="w-full pl-7 pr-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none"
                        placeholder="strona-glowna">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Moduł</label>
                <select id="module" name="module" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white">
                    <option value="onepage" {{ 'selected' if page and page.module == 'onepage' else '' }}>OnePage</option>
                    <option value="blog" {{ 'selected' if page and page.module == 'blog' else '' }}>Blog</option>
                    <option value="shop" {{ 'selected' if page and page.module == 'shop' else '' }}>Sklep</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Meta description (SEO)</label>
            <textarea id="meta_description" name="meta_description" rows="2"
                class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none resize-none"
                placeholder="Krótki opis strony dla wyszukiwarek...">{{ page.meta_description if page else '' }}</textarea>
        </div>

        <div class="flex items-center gap-6">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="is_published" name="is_published" {{ 'checked' if page and page.is_published else '' }} class="w-4 h-4 text-primary rounded border-gray-300 focus:ring-primary">
                <span class="text-sm text-gray-700">Opublikowana</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="is_homepage" name="is_homepage" {{ 'checked' if page and page.is_homepage else '' }} class="w-4 h-4 text-primary rounded border-gray-300 focus:ring-primary">
                <span class="text-sm text-gray-700">Strona główna</span>
            </label>
        </div>

        <div class="flex items-center gap-3 pt-4 border-t">
            <button type="submit" class="bg-primary hover:bg-amber-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                {{ 'Zapisz zmiany' if page else 'Utwórz stronę' }}
            </button>
            <a href="/admin/pages" class="px-6 py-2 text-gray-600 hover:text-gray-800 font-medium transition-colors">Anuluj</a>
            {% if page %}
            <a href="/admin/pages/{{ page.id }}/sections" class="ml-auto text-primary hover:text-accent font-medium text-sm flex items-center gap-1">
                Zarządzaj sekcjami <i class="fas fa-arrow-right"></i>
            </a>
            {% endif %}
        </div>
    </form>
</div>

<script>
document.getElementById('title').addEventListener('input', function() {
    const slug = document.getElementById('slug');
    if (!slug.dataset.edited) {
        slug.value = this.value.toLowerCase()
            .replace(/[^a-z0-9\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .substring(0, 60);
    }
});
document.getElementById('slug').addEventListener('input', function() {
    this.dataset.edited = 'true';
});

document.getElementById('pageForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const data = {
        title: document.getElementById('title').value,
        slug: document.getElementById('slug').value,
        module: document.getElementById('module').value,
        meta_description: document.getElementById('meta_description').value,
        is_published: document.getElementById('is_published').checked,
        is_homepage: document.getElementById('is_homepage').checked,
        template: 'default'
    };

    const url = {{ page.id if page else 'null' }} ? `/api/pages/{{ page.id if page else '0' }}` : '/api/pages';
    const method = {{ 'true' if page else 'false' }} ? 'PUT' : 'POST';

    const res = await fetch(url, {
        method: method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });

    if (res.ok) {
        window.location.href = '/admin/pages';
    } else {
        const err = await res.json();
        alert('Błąd: ' + (err.detail || 'Nie udało się zapisać'));
    }
});
</script>
{% endblock %}
